name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Build
        id: build
        run: pnpm build
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          TRACY_URL: ${{ secrets.TRACY_URL }}

      - name: Notify Zoho Cliq on failure
        if: failure()
        run: |
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ steps.lint.outcome }}" == "failure" ]; then
            STEP="Lint"
            ACTION="Run \`pnpm lint\` locally to reproduce, then fix the reported ESLint errors."
          elif [ "${{ steps.build.outcome }}" == "failure" ]; then
            STEP="Build"
            ACTION="Run \`pnpm build\` locally to reproduce. Check for type errors or missing env vars."
          else
            STEP="Setup / Install"
            ACTION="Check the run log — likely a dependency or pnpm install issue."
          fi

          MESSAGE="🚨 *CI Failure on \`${BRANCH}\`*\n📍 *Failed step:* ${STEP}\n🔧 *What to do:* ${ACTION}\n📝 Commit: \`${SHA:0:7}\` | Triggered by: ${{ github.event_name }}\n👉 [View run #${{ github.run_number }}](${RUN_URL})"
          curl -s -X POST \
            "https://cliq.zoho.com/company/924985165/api/v2/channelsbyname/productcomm/message?zapikey=${{ secrets.ZOHO_CLIQ_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"${MESSAGE}\"}"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const sha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const lintFailed = '${{ steps.lint.outcome }}' === 'failure';
            const buildFailed = '${{ steps.build.outcome }}' === 'failure';
            const failedStep = lintFailed ? 'Lint' : buildFailed ? 'Build' : 'Setup / Install';
            const action = lintFailed
              ? 'Run `pnpm lint` locally to reproduce and fix the ESLint errors.'
              : buildFailed
              ? 'Run `pnpm build` locally to reproduce. Check for type errors or missing env vars.'
              : 'Check the run log — likely a dependency or pnpm install issue.';

            const title = `CI failure [${failedStep}]: ${context.workflow} #${context.runNumber} on \`${branch}\``;

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-failure',
              state: 'open',
            });
            if (open.some(i => i.title === title)) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['ci-failure', 'bug'],
              body: [
                '## CI Failure',
                '',
                '| | |',
                '|---|---|',
                `| **Branch** | \`${branch}\` |`,
                `| **Commit** | \`${sha}\` |`,
                `| **Failed step** | ${failedStep} |`,
                `| **Triggered by** | ${context.eventName} |`,
                `| **Run log** | [View run #${context.runNumber}](${runUrl}) |`,
                '',
                `### What to do`,
                action,
              ].join('\n'),
            });